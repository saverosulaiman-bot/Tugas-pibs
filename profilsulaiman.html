<!DOCTYPE html>
<html lang="id">
<head>

            align-items: center;
            min-height: 100vh;
        }

            background-color: #ffffff;

        h1 {
            font-size: 22px;
            color: #333;
            margin-bottom: 5px;
        }
        .subtitle {
            color: #666;
            font-size: 14px;
            margin-bottom: 20px;

            text-align: left;
            font-size: 14px;
            color: #444;

    <div class="card">
        <img src="https://via.placeholder.com/120" alt="Foto Profil" class="avatar">

        <div class="bio">

            <p><strong>Tugas:</strong> Tugas 1 - Membuat Profil</p>
